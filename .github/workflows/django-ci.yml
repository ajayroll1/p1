name: Django CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # =========================
  # CI
  # =========================
  test:
    name: Test Django
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test


  # =========================
  # CD
  # =========================
  deploy:
    name: Deploy to Azure
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

        run: |

          # =========================
          # GitHub runner SSH setup
          # =========================

          mkdir -p ~/.ssh

          echo "$AZURE_SSH_KEY" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key

          # =========================
          # Connect to Azure
          # =========================

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/azure_key \
            "$AZURE_USERNAME@$AZURE_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'

          set -e

          echo "======================================"
          echo "       P1 Django Deployment"
          echo "======================================"

          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/p1}"
          MARKER="/etc/p1/bootstrap.done"

          echo "Application path: $DEPLOY_PATH"

          # ==================================================
          # FIRST TIME SERVER SETUP
          # ==================================================

          if [ ! -f "$MARKER" ]; then

              echo "First-time setup detected"

              # -------------------------
              # System packages
              # -------------------------

              sudo apt update

              sudo apt install -y \
                git \
                python3 \
                python3-venv \
                python3-pip \
                nginx \
                curl

              # -------------------------
              # Application directory
              # -------------------------

              sudo mkdir -p "$DEPLOY_PATH"
              sudo chown -R "$USER:$USER" "$DEPLOY_PATH"

              # -------------------------
              # Clone repository
              # -------------------------

              if [ ! -d "$DEPLOY_PATH/.git" ]; then

                  git clone \
                    https://github.com/ajayroll1/p1.git \
                    "$DEPLOY_PATH"

              else

                  cd "$DEPLOY_PATH"

                  git fetch origin
                  git reset --hard origin/main

              fi

              cd "$DEPLOY_PATH"

              # -------------------------
              # Virtual environment
              # -------------------------

              if [ ! -x "$DEPLOY_PATH/.venv/bin/python" ]; then

                  python3 -m venv "$DEPLOY_PATH/.venv"

              fi

              source "$DEPLOY_PATH/.venv/bin/activate"

              python -m pip install --upgrade pip
              pip install -r requirements.txt

              # Gunicorn
              pip install gunicorn

              # -------------------------
              # Django validation
              # -------------------------

              python manage.py check

              # -------------------------
              # Database
              # -------------------------

              python manage.py migrate

              # -------------------------
              # Static files
              # -------------------------

              python manage.py collectstatic --noinput

              # ==================================================
              # SYSTEMD
              # ==================================================

              sudo tee /etc/systemd/system/p1.service > /dev/null << SERVICE
          [Unit]
          Description=P1 Django App
          After=network.target

          [Service]
          User=$USER
          Group=www-data
          WorkingDirectory=$DEPLOY_PATH
          ExecStart=$DEPLOY_PATH/.venv/bin/gunicorn --bind 127.0.0.1:8000 project.wsgi:application
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          SERVICE

              # ==================================================
              # NGINX
              # ==================================================

              sudo tee /etc/nginx/sites-available/p1 > /dev/null << NGINX
          server {
              listen 80;
              server_name _;

              location /static/ {
                  alias $DEPLOY_PATH/staticfiles/;
              }

              location / {
                  proxy_pass http://127.0.0.1:8000;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              sudo ln -sf \
                /etc/nginx/sites-available/p1 \
                /etc/nginx/sites-enabled/p1

              sudo rm -f /etc/nginx/sites-enabled/default

              # Validate Nginx
              sudo nginx -t

              # -------------------------
              # Enable services
              # -------------------------

              sudo systemctl daemon-reload

              sudo systemctl enable p1
              sudo systemctl enable nginx

              sudo systemctl restart p1
              sudo systemctl restart nginx

              # -------------------------
              # Health check
              # -------------------------

              sleep 3

              curl -f http://127.0.0.1/ > /dev/null

              # -------------------------
              # Bootstrap marker
              # -------------------------

              sudo mkdir -p /etc/p1

              echo "bootstrap-complete" | \
                sudo tee "$MARKER" > /dev/null

              echo "======================================"
              echo " First-time setup completed"
              echo "======================================"


          # ==================================================
          # NORMAL DEPLOYMENT
          # ==================================================

          else

              echo "Existing server detected"
              echo "Running update deployment"

              cd "$DEPLOY_PATH"

              # -------------------------
              # Pull latest code
              # -------------------------

              git fetch origin
              git reset --hard origin/main

              # -------------------------
              # Python environment
              # -------------------------

              source "$DEPLOY_PATH/.venv/bin/activate"

              pip install -r requirements.txt

              # Ensure Gunicorn exists
              pip install gunicorn

              # -------------------------
              # Django validation
              # -------------------------

              python manage.py check

              # -------------------------
              # Database
              # -------------------------

              python manage.py migrate

              # -------------------------
              # Static files
              # -------------------------

              python manage.py collectstatic --noinput

              # -------------------------
              # Restart application
              # -------------------------

              sudo systemctl restart p1

              sudo systemctl reload nginx

              # -------------------------
              # Health check
              # -------------------------

              sleep 2

              curl -f http://127.0.0.1/ > /dev/null

              echo "======================================"
              echo " Deployment successful"
              echo "======================================"

          fi

          EOF