name: Django CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # CI
  # =========================================================

  test:
    name: Test Django
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Django check
        run: |
          python manage.py check

      - name: Check migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run tests
        run: |
          python manage.py test


  # =========================================================
  # CD
  # =========================================================

  deploy:
    name: Deploy to Azure

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

        run: |

          set -e

          echo "========================================"
          echo "       DJANGO AZURE CI/CD"
          echo "========================================"

          echo "Deploy Path: $DEPLOY_PATH"
          echo "Azure Host : $AZURE_HOST"


          # =================================================
          # SSH CONFIGURATION
          # =================================================

          mkdir -p ~/.ssh

          echo "$AZURE_SSH_KEY" > ~/.ssh/azure_key

          chmod 600 ~/.ssh/azure_key


          # =================================================
          # CONNECT TO AZURE
          # =================================================

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/azure_key \
            "$AZURE_USERNAME@$AZURE_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' AZURE_HOST='$AZURE_HOST' bash -s" << 'EOF'

          set -e

          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/p1}"
          AZURE_HOST="${AZURE_HOST}"

          MARKER="/etc/p1/bootstrap.done"


          echo ""
          echo "========================================"
          echo "Azure Deployment Started"
          echo "========================================"


          # =================================================
          # FIRST-TIME SETUP
          # =================================================

          if [ ! -f "$MARKER" ]; then

              echo ""
              echo "========================================"
              echo "FIRST-TIME SERVER SETUP"
              echo "========================================"


              # -------------------------------------------------
              # System packages
              # -------------------------------------------------

              echo "Installing system packages..."

              sudo apt update

              sudo apt install -y \
                git \
                python3 \
                python3-venv \
                python3-pip \
                nginx \
                curl


              # -------------------------------------------------
              # CLEAN OLD APPLICATION DIRECTORY
              # -------------------------------------------------

              echo "Cleaning application directory..."

              sudo mkdir -p "$(dirname "$DEPLOY_PATH")"

              sudo rm -rf "$DEPLOY_PATH"


              # -------------------------------------------------
              # CLONE REPOSITORY
              # -------------------------------------------------

              echo "Cloning GitHub repository..."

              git clone \
                https://github.com/ajayroll1/p1.git \
                "$DEPLOY_PATH"


              sudo chown -R "$USER:$USER" "$DEPLOY_PATH"

              cd "$DEPLOY_PATH"


              # -------------------------------------------------
              # CREATE VIRTUAL ENVIRONMENT
              # -------------------------------------------------

              echo "Creating virtual environment..."

              python3 -m venv "$DEPLOY_PATH/.venv"

              source "$DEPLOY_PATH/.venv/bin/activate"


              # -------------------------------------------------
              # INSTALL PYTHON PACKAGES
              # -------------------------------------------------

              echo "Installing Python packages..."

              python -m pip install --upgrade pip

              pip install -r requirements.txt

              pip install gunicorn


              # -------------------------------------------------
              # CONFIGURE DJANGO SETTINGS
              # -------------------------------------------------

              echo "Configuring Django settings..."

              python - <<PY

          from pathlib import Path
          import re

          settings_file = Path("$DEPLOY_PATH/project/settings.py")

          text = settings_file.read_text(encoding="utf-8")


          # ================================================
          # ALLOWED HOSTS
          # ================================================

          allowed_hosts = (
              'ALLOWED_HOSTS = ["$AZURE_HOST", "127.0.0.1", "localhost"]'
          )

          if re.search(
              r"^\s*ALLOWED_HOSTS\s*=.*$",
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r"^\s*ALLOWED_HOSTS\s*=.*$",
                  allowed_hosts,
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              text += "\n" + allowed_hosts + "\n"


          # ================================================
          # STATIC URL
          # ================================================

          static_url = 'STATIC_URL = "/static/"'

          if re.search(
              r"^\s*STATIC_URL\s*=.*$",
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r"^\s*STATIC_URL\s*=.*$",
                  static_url,
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              text += "\n" + static_url + "\n"


          # ================================================
          # STATIC ROOT
          # ================================================

          static_root = 'STATIC_ROOT = BASE_DIR / "staticfiles"'

          if re.search(
              r"^\s*STATIC_ROOT\s*=.*$",
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r"^\s*STATIC_ROOT\s*=.*$",
                  static_root,
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              text += "\n" + static_root + "\n"


          settings_file.write_text(text, encoding="utf-8")

          print("Django production settings configured.")

          PY


              # -------------------------------------------------
              # DJANGO CHECK
              # -------------------------------------------------

              echo "Running Django check..."

              python manage.py check


              # -------------------------------------------------
              # DATABASE MIGRATIONS
              # -------------------------------------------------

              echo "Running migrations..."

              python manage.py migrate


              # -------------------------------------------------
              # STATIC FILES
              # -------------------------------------------------

              echo "Collecting static files..."

              python manage.py collectstatic --noinput


              # =================================================
              # SYSTEMD / GUNICORN
              # =================================================

              echo "Creating Gunicorn systemd service..."

              sudo tee /etc/systemd/system/p1.service > /dev/null << SERVICE

          [Unit]
          Description=P1 Django App
          After=network.target

          [Service]
          User=$USER
          Group=www-data
          WorkingDirectory=$DEPLOY_PATH
          ExecStart=$DEPLOY_PATH/.venv/bin/gunicorn --bind 127.0.0.1:8000 project.wsgi:application
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

          SERVICE


              # =================================================
              # NGINX
              # =================================================

              echo "Creating Nginx configuration..."

              sudo tee /etc/nginx/sites-available/p1 > /dev/null << NGINX

          server {
              listen 80;
              server_name _;

              location /static/ {
                  alias $DEPLOY_PATH/staticfiles/;
              }

              location / {
                  proxy_pass http://127.0.0.1:8000;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }

          NGINX


              # -------------------------------------------------
              # ENABLE NGINX SITE
              # -------------------------------------------------

              sudo ln -sf \
                /etc/nginx/sites-available/p1 \
                /etc/nginx/sites-enabled/p1

              sudo rm -f /etc/nginx/sites-enabled/default


              # -------------------------------------------------
              # NGINX TEST
              # -------------------------------------------------

              echo "Testing Nginx..."

              sudo nginx -t


              # -------------------------------------------------
              # ENABLE SERVICES
              # -------------------------------------------------

              sudo systemctl daemon-reload

              sudo systemctl enable p1

              sudo systemctl enable nginx


              # -------------------------------------------------
              # START SERVICES
              # -------------------------------------------------

              echo "Starting Django service..."

              sudo systemctl restart p1

              echo "Starting Nginx..."

              sudo systemctl restart nginx


              # -------------------------------------------------
              # HEALTH CHECK
              # -------------------------------------------------

              echo "Running health check..."

              sleep 3

              curl \
                --fail \
                -H "Host: $AZURE_HOST" \
                http://127.0.0.1/ \
                > /dev/null


              # -------------------------------------------------
              # BOOTSTRAP MARKER
              # -------------------------------------------------

              sudo mkdir -p /etc/p1

              echo "bootstrap-complete" | \
                sudo tee "$MARKER" > /dev/null


              echo ""
              echo "========================================"
              echo "FIRST DEPLOYMENT SUCCESSFUL"
              echo "========================================"


          # =================================================
          # FUTURE DEPLOYMENT
          # =================================================

          else

              echo ""
              echo "========================================"
              echo "NORMAL UPDATE DEPLOYMENT"
              echo "========================================"


              cd "$DEPLOY_PATH"


              # -------------------------------------------------
              # UPDATE SOURCE CODE
              # -------------------------------------------------

              echo "Updating source code..."

              git fetch origin

              git reset --hard origin/main


              # -------------------------------------------------
              # VIRTUAL ENVIRONMENT
              # -------------------------------------------------

              if [ ! -x "$DEPLOY_PATH/.venv/bin/python" ]; then

                  echo "Virtual environment missing."

                  python3 -m venv "$DEPLOY_PATH/.venv"

              fi

              source "$DEPLOY_PATH/.venv/bin/activate"


              # -------------------------------------------------
              # DEPENDENCIES
              # -------------------------------------------------

              echo "Updating Python dependencies..."

              python -m pip install --upgrade pip

              pip install -r requirements.txt

              pip install gunicorn


              # -------------------------------------------------
              # DJANGO SETTINGS
              # -------------------------------------------------

              echo "Updating Django production settings..."

              python - <<PY

          from pathlib import Path
          import re

          settings_file = Path("$DEPLOY_PATH/project/settings.py")

          text = settings_file.read_text(encoding="utf-8")


          # ================================================
          # ALLOWED HOSTS
          # ================================================

          allowed_hosts = (
              'ALLOWED_HOSTS = ["$AZURE_HOST", "127.0.0.1", "localhost"]'
          )

          if re.search(
              r"^\s*ALLOWED_HOSTS\s*=.*$",
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r"^\s*ALLOWED_HOSTS\s*=.*$",
                  allowed_hosts,
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              text += "\n" + allowed_hosts + "\n"


          # ================================================
          # STATIC URL
          # ================================================

          static_url = 'STATIC_URL = "/static/"'

          if re.search(
              r"^\s*STATIC_URL\s*=.*$",
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r"^\s*STATIC_URL\s*=.*$",
                  static_url,
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              text += "\n" + static_url + "\n"


          # ================================================
          # STATIC ROOT
          # ================================================

          static_root = 'STATIC_ROOT = BASE_DIR / "staticfiles"'

          if re.search(
              r"^\s*STATIC_ROOT\s*=.*$",
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r"^\s*STATIC_ROOT\s*=.*$",
                  static_root,
                  text,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              text += "\n" + static_root + "\n"


          settings_file.write_text(text, encoding="utf-8")

          print("Django production settings updated.")

          PY


              # -------------------------------------------------
              # DJANGO CHECK
              # -------------------------------------------------

              echo "Running Django check..."

              python manage.py check


              # -------------------------------------------------
              # DATABASE
              # -------------------------------------------------

              echo "Running migrations..."

              python manage.py migrate


              # -------------------------------------------------
              # STATIC FILES
              # -------------------------------------------------

              echo "Collecting static files..."

              python manage.py collectstatic --noinput


              # -------------------------------------------------
              # RESTART GUNICORN
              # -------------------------------------------------

              echo "Restarting Django..."

              sudo systemctl restart p1


              # -------------------------------------------------
              # RELOAD NGINX
              # -------------------------------------------------

              echo "Reloading Nginx..."

              sudo nginx -t

              sudo systemctl reload nginx


              # -------------------------------------------------
              # HEALTH CHECK
              # -------------------------------------------------

              echo "Running health check..."

              sleep 2

              curl \
                --fail \
                -H "Host: $AZURE_HOST" \
                http://127.0.0.1/ \
                > /dev/null


              echo ""
              echo "========================================"
              echo "UPDATE DEPLOYMENT SUCCESSFUL"
              echo "========================================"

          fi

          EOF